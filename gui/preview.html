<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savepoint · 3D Companion</title>
<style>
  :root{--bg:#0a0812;--panel:#151024;--line:#2a2242;--ink:#ece9ff;--dim:#a79fc4;--accent:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:var(--ink);background:radial-gradient(1200px 700px at 30% -10%,#241a44 0%,var(--bg) 65%);
       min-height:100vh;overflow:hidden}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;inset:auto auto 18px 18px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 36px)}
  .hud button{background:rgba(21,16,36,.82);backdrop-filter:blur(10px);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px;font:inherit;font-size:13px;
    font-weight:600;cursor:pointer;transition:.15s}
  .hud button:hover{border-color:var(--accent);transform:translateY(-1px)}
  .hud button.on{background:rgba(139,92,246,.35);border-color:var(--accent)}
  .top{position:fixed;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;
       align-items:flex-start;gap:12px;pointer-events:none}
  .title{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .title b{display:block;font-size:19px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
  .species{display:flex;gap:6px;pointer-events:auto}
  .species button{background:rgba(21,16,36,.82);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .species button.on{color:#fff;background:rgba(139,92,246,.35);border-color:var(--accent)}
  #bubble{position:absolute;max-width:240px;padding:10px 13px;border-radius:14px;
    background:rgba(244,242,255,.97);color:#1b1630;font-size:13px;font-weight:600;line-height:1.35;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transform-origin:bottom center;
    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
  #bubble.show{opacity:1}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;
    background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
  #bubble.below::after{bottom:auto;top:-6px}
  .hint{position:fixed;bottom:18px;right:18px;font-size:12px;color:var(--dim);text-align:right;pointer-events:none}
  .err{position:fixed;inset:0;display:none;place-items:center;background:#0a0812;color:#fb7185;
       padding:40px;text-align:center;font-family:ui-monospace,monospace;font-size:13px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="top">
  <div class="title">Savepoint companion<b id="petname">Mochi</b></div>
  <div class="species" id="species">
    <button data-species="human">human</button>
    <button data-species="cat" class="on">cat</button>
    <button data-species="dog">dog</button>
    <button data-species="blob">blob</button>
  </div>
</div>
<div id="bubble"></div>
<div class="hud">
  <button id="water">💧 remind me</button>
  <button id="celebrate">✓ recovered</button>
  <button id="sleep">😴 sleep</button>
  <button id="walk" class="on">🚶 wander</button>
  <button id="orbit">🔄 spin</button>
</div>
<div class="hint">drag to rotate · wheel to zoom<br>same engine as the desktop pet</div>
<div class="err" id="err"></div>

const { Companion } = SavepointCompanion;
// ---- demo harness (the real app supplies these facts from the reminder engine + vault) ----
const stage = document.getElementById('stage');
const bubble = document.getElementById('bubble');
const petname = document.getElementById('petname');

const PALETTES = {
  human: { skin:'#e8b58a', hair:'#1b1410', top:'#6d28d9', bottom:'#111827', accent:'#22d3ee' },
  cat:   { skin:'#f4a259', hair:'#f4a259', top:'#fb923c', bottom:'#fb923c', accent:'#fde047' },
  dog:   { skin:'#d9a066', hair:'#8b5e34', top:'#a16207', bottom:'#a16207', accent:'#f87171' },
  blob:  { skin:'#a78bfa', hair:'#a78bfa', top:'#8b5cf6', bottom:'#7c3aed', accent:'#f472b6' },
};
const BODIES = {
  human: { height:1.7, head_ratio:0.16, shoulder:0.24, limb:0.055 },
  cat:   { height:0.62, head_ratio:0.34, shoulder:0.2, limb:0.07 },
  dog:   { height:0.68, head_ratio:0.31, shoulder:0.22, limb:0.08 },
  blob:  { height:0.5,  head_ratio:0.5, shoulder:0.3, limb:0.05 },
};
const NAMES = { human:'Kai', cat:'Mochi', dog:'Biscuit', blob:'Pip' };

(async () => {
  try {
    const c = new Companion({ mount: stage, desktopMode: false });
    await c.init();
    let species = 'cat';
    let orbit = false;
    const apply = () => {
      c.buildCharacter({ species, palette: PALETTES[species], body: BODIES[species], seed: 3 });
      petname.textContent = NAMES[species];
    };
    apply();

    // Gentle camera orbit for the "spin" toggle.
    let yaw = 0;
    const baseRender = c.render.bind(c);
    c.render = () => {
      if (orbit) {
        yaw += 0.006;
        const r = 4.4;
        c.camera.position.x = Math.sin(yaw) * r * 0.55;
        c.camera.position.z = Math.cos(yaw) * r;
        c.camera.lookAt(0, 1.0, 0);
      }
      baseRender();
    };

    // Speech bubble follows the head, clamped to the viewport.
    const drawBubble = () => {
      if (!c.bubble) { bubble.classList.remove('show'); return; }
      const head = c.headScreenPosition();
      const w = bubble.offsetWidth || 200, h = bubble.offsetHeight || 44;
      const pos = placeBubbleFor(head.x, head.y, w, h, stage.clientWidth, stage.clientHeight, 14);
      bubble.style.left = pos.x + 'px';
      bubble.style.top = pos.y + 'px';
      bubble.classList.toggle('below', pos.flipped);
      bubble.textContent = c.bubble.text;
      // Fade in/out over the last second of the bubble's life.
      const life = c.bubble.ttl - c.bubble.age;
      bubble.style.opacity = life < 1 ? Math.max(0, life) : 1;
      bubble.classList.add('show');
    };

    // Local copy of the placement maths (the bundle does not re-export the module namespace).
    function placeBubbleFor(hx, hy, bw, bh, vw, vh, gap) {
      let x = hx - bw / 2, y = hy - bh - gap, flipped = false;
      if (y < 4) { y = hy + gap; flipped = true; }
      x = Math.max(4, Math.min(x, Math.max(4, vw - bw - 4)));
      y = Math.max(4, Math.min(y, Math.max(4, vh - bh - 4)));
      return { x, y, flipped };
    }

    window.__companion = c; // debug handle
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      c.update(dt);
      c.render();
      drawBubble();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    // ---- HUD wiring
    document.getElementById('species').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      species = b.dataset.species;
      [...document.querySelectorAll('#species button')].forEach((x) => x.classList.toggle('on', x === b));
      apply();
    });
    document.getElementById('water').onclick = () => c.setReminder('water break 💧');
    document.getElementById('celebrate').onclick = () => c.celebrate('I caught that — nothing lost 🙂');
    const sleepBtn = document.getElementById('sleep');
    let sleeping = false;
    sleepBtn.onclick = () => { sleeping = !sleeping; c.setSleeping(sleeping); sleepBtn.classList.toggle('on', sleeping); };
    const walkBtn = document.getElementById('walk');
    let walking = true;
    walkBtn.onclick = () => { walking = !walking; c.setWalking(walking); walkBtn.classList.toggle('on', walking); };
    const orbitBtn = document.getElementById('orbit');
    orbitBtn.onclick = () => { orbit = !orbit; orbitBtn.classList.toggle('on', orbit); };

    // Set up the desktop hint: dragging counts as petting.
    stage.addEventListener('pointerdown', () => c.setDragged(true));
    stage.addEventListener('pointerup', () => c.setDragged(false));
    stage.addEventListener('pointerleave', () => c.setDragged(false));

    // Demo: one reminder after a few seconds so the page is not static on first load.
    setTimeout(() => c.setReminder('water break 💧'), 2600);
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'grid';
    el.textContent = 'WebGL unavailable in this preview: ' + (e && e.message ? e.message : e) +
      '\n\nThe companion runs in a real browser or the desktop window.';
    console.error(e);
  }
})();
</script>
