name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-latest,   target: aarch64-unknown-linux-gnu, archive: tar.gz, cross: true }
          - { os: macos-latest,    target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-latest,    target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Flat, version-less names: scripts/install.sh and install.ps1 resolve exactly these,
          # and VERSION selects the tag through the release URL rather than the filename.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  ASSET=tether-linux-x86_64 ;;
            aarch64-unknown-linux-gnu) ASSET=tether-linux-aarch64 ;;
            aarch64-apple-darwin)      ASSET=tether-macos-aarch64 ;;
            x86_64-apple-darwin)       ASSET=tether-macos-x86_64 ;;
            x86_64-pc-windows-msvc)    ASSET=tether-windows-x86_64 ;;
            *) echo "unmapped target"; exit 1 ;;
          esac
          BIN="target/${{ matrix.target }}/release/tether"
          mkdir -p "dist/$ASSET"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          cp "$BIN" "dist/$ASSET/"
          cp README.md LICENSE docs/limitations.md "dist/$ASSET/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "$BIN" "dist/$ASSET.exe"
            (cd dist && 7z a "$ASSET.zip" "$ASSET" > /dev/null)
            echo "ASSET=dist/$ASSET.zip" >> $GITHUB_ENV
          else
            (cd dist && tar czf "$ASSET.tar.gz" "$ASSET")
            echo "ASSET=dist/$ASSET.tar.gz" >> $GITHUB_ENV
          fi

      - name: Package Windows Desktop App
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          # Code-signing secrets — set these in GitHub → Settings → Secrets.
          # All three must be present for signing to run; if any is absent the
          # build still succeeds but the binaries will be unsigned.
          #
          # How to get a certificate:
          #   Option A (recommended for CI): ssl.com OV/EV eSigner cloud HSM
          #     WINDOWS_CERTIFICATE      — base64-encoded .pfx  (openssl pkcs12 … | base64)
          #     WINDOWS_CERTIFICATE_PWD  — PFX passphrase
          #     (EV only) ESIGNER_USERNAME / ESIGNER_PASSWORD / ESIGNER_TOTP_SECRET
          #   Option B: any .pfx from DigiCert / Sectigo / GlobalSign
          #     Same two secrets, no eSigner env vars needed.
          #
          # Tauri picks up TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # automatically for updater bundle signing (separate from EXE signing below).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail

          # Populate ONLY the two bundled companions (grace + rory) with WebP clips.
          # All other companions are on-demand downloads — keeping the installer slim.
          # The manifest.json files are committed; WebP binaries are gitignored.
          # We fetch the monolithic pack and extract only grace/ and rory/ from it.
          # If the download fails (first release, no pack yet) we skip silently —
          # Tauri only requires the directories to exist; manifests are on disk already.
          for COMPANION in grace rory; do
            DIR="assets/companions/$COMPANION"
            PACK_URL="https://github.com/${{ github.repository }}/releases/latest/download/companion-webp-pack.zip"
            if [ -d "$DIR" ] && ! ls "$DIR"/*.webp 2>/dev/null | head -1 | grep -q .; then
              echo "Fetching WebP pack for bundled companion: $COMPANION"
              if curl -fsSL "$PACK_URL" -o companion-webp-pack.zip 2>/dev/null; then
                unzip -q companion-webp-pack.zip "companions/$COMPANION/*.webp" -d assets/ 2>/dev/null || \
                unzip -q companion-webp-pack.zip "$COMPANION/*.webp" -d "$DIR" 2>/dev/null || true
                rm -f companion-webp-pack.zip
              else
                echo "No WebP pack available yet — building $COMPANION with manifests only."
              fi
            fi
          done

          # Build the NSIS installer via Tauri — produces the setup.exe that the
          # README download link points at.
          cd desktop
          npm install
          node node_modules/@tauri-apps/cli/tauri.js build
          cd ..

          # Derive the NSIS filename from tauri.conf.json — stays in sync automatically.
          TAURI_VER="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          NSIS_BIN="desktop/src-tauri/target/release/bundle/nsis/Tether_${TAURI_VER}_x64-setup.exe"
          DESK_BIN="desktop/src-tauri/target/release/tether-desktop.exe"

          # ── Authenticode signing (runs only when certificate secrets are set) ──
          if [ -n "${WINDOWS_CERTIFICATE:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PWD:-}" ]; then
            echo "Signing binaries with Authenticode..."
            # Decode the base64-encoded PFX to a temp file
            PFX_PATH="$(mktemp --suffix=.pfx)"
            echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$PFX_PATH"

            sign_binary() {
              local bin="$1"
              [ -f "$bin" ] || return 0
              signtool.exe sign \
                /fd SHA256 \
                /f "$PFX_PATH" \
                /p "$WINDOWS_CERTIFICATE_PWD" \
                /tr http://timestamp.sectigo.com \
                /td SHA256 \
                /d "Tether" \
                /du "https://github.com/${{ github.repository }}" \
                "$bin"
            }

            # Sign the main executable first, then the NSIS installer that wraps it
            sign_binary "$DESK_BIN"
            sign_binary "$NSIS_BIN"
            rm -f "$PFX_PATH"
          else
            echo "WINDOWS_CERTIFICATE secret not set — skipping Authenticode signing."
            echo "To suppress the SmartScreen 'Unknown publisher' warning, add:"
            echo "  WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PWD"
            echo "  as GitHub repository secrets."
          fi

          # Copy the NSIS installer as the primary Windows download asset.
          # Two names are published:
          #   Tether_<version>_x64-setup.exe  — versioned, for release notes and direct links
          #   Tether_x64-setup.exe            — versionless stable name; /releases/latest/download/
          #                                     always resolves here without README edits on each bump
          if [ -f "$NSIS_BIN" ]; then
            cp "$NSIS_BIN" "dist/Tether_${TAURI_VER}_x64-setup.exe"
            cp "$NSIS_BIN" "dist/Tether_x64-setup.exe"
          fi
          # Also ship the raw tether-desktop.exe for users who prefer no installer.
          if [ -f "$DESK_BIN" ]; then
            cp "$DESK_BIN" "dist/tether-desktop-windows-x86_64.exe"
            mkdir -p "dist/tether-desktop-windows-x86_64"
            cp "$DESK_BIN" "dist/tether-desktop-windows-x86_64/"
            cp README.md LICENSE docs/limitations.md "dist/tether-desktop-windows-x86_64/"
            (cd dist && 7z a "tether-desktop-windows-x86_64.zip" "tether-desktop-windows-x86_64" > /dev/null)
          fi
          # Bundle ALL companion WebP clips into the monolithic pack (used by on-demand
          # download and future CI bootstraps).
          if [ -d "assets/companions" ]; then
            (cd assets && 7z a "../dist/companion-webp-pack.zip" companions > /dev/null)
            echo "Companion WebP pack zipped for release."
          fi
          # Publish per-companion zips so users can download individual companions
          # (≈3–7 MB each) instead of the full 157 MB monolithic pack.
          for CDIR in assets/companions/*/; do
            CNAME="$(basename "$CDIR")"
            if [ -d "$CDIR" ] && ls "$CDIR"/*.webp 2>/dev/null | head -1 | grep -q .; then
              (cd assets/companions && zip -qr "../../dist/companion-${CNAME}.zip" "$CNAME/")
              echo "Packaged companion-${CNAME}.zip"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # Use dist/ (not dist/*.*) so every file in the dir is captured,
          # including versionless aliases like Tether_x64-setup.exe that
          # have no extra dot segments in their names.
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The installer refuses to run without this file, so the release must always have one.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz *.zip *.exe > checksums.txt 2>/dev/null || sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.*
          generate_release_notes: true
          body: |
            ## Install

            Linux / macOS:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            tether setup
            ```

            Windows (PowerShell):

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            tether setup
            ```

            The installer checks the SHA-256 of the download against `checksums.txt` and refuses
            to install on a mismatch. No root, no service manager, no network calls at runtime.
            One binary, about 2 MB. Assets are named `tether-<platform>-<cpu>`, so the install
            command above keeps working across releases.
