<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: no-drag;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
      /* Only the bottom strip is interactive — the rest is click-through */
      pointer-events: none;
    }
    /* Re-enable pointer events on the companion itself via JS */
  </style>
</head>
<body>
  <canvas id="companion-canvas"></canvas>
  <script type="module" src="./companion-overlay.js"></script>
</body>
</html>
