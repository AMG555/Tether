<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: no-drag;
    }
    /* Live hardware-accelerated animated WebP sprite — sits beneath canvas
       so speech bubbles and status indicators always draw in front of the head */
    #companion-sprite {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 2;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      image-rendering: auto;
      will-change: transform, left, top;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
      z-index: 4;
    }
    /* Invisible hit zone — follows character position, captures mouse events */
    #hit-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 220px;
      pointer-events: auto;
      cursor: grab;
      background: transparent;
      z-index: 10;
      touch-action: none;
      /* Smooth cursor transition when transitioning grab → grabbing */
      transition: cursor 0.05s;
      user-select: none;
      -webkit-user-select: none;
    }
    #hit-zone.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="companion-canvas"></canvas>
  <img id="companion-sprite" alt="" aria-hidden="true">
  <!-- role=button + title give keyboard/screen-reader users a hint -->
  <div id="hit-zone" role="button" tabindex="-1" aria-label="Companion — drag to move, click to interact, right-click to toggle Free Roam" title="Drag to move · Click to interact · Right-click for Free Roam"></div>
  <script type="module" src="./companion-overlay.js"></script>
</body>
</html>
