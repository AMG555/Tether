<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: no-drag;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
    }
    /* Invisible hit zone — follows the character position, captures mouse events */
    #hit-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 220px;
      pointer-events: auto;
      cursor: grab;
      background: transparent;
      z-index: 10;
      touch-action: none;
      /* Smooth cursor transition when transitioning grab → grabbing */
      transition: cursor 0.05s;
      user-select: none;
      -webkit-user-select: none;
    }
    #hit-zone.dragging {
      cursor: grabbing;
    }
    /* Free Roam toggle button — appears near companion, stays subtle */
    #roam-btn {
      position: fixed;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.22);
      background: rgba(20,21,22,0.72);
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s, background 0.15s, border-color 0.15s;
      user-select: none;
      -webkit-user-select: none;
      title: "Toggle Free Roam mode";
    }
    /* Show button when hovering anywhere over the overlay */
    body:hover #roam-btn {
      opacity: 1;
    }
    #roam-btn:hover {
      background: rgba(248,110,96,0.85);
      border-color: rgba(248,110,96,0.9);
      color: #fff;
    }
    /* Active (roam on) state */
    #roam-btn.roam-on {
      background: rgba(93,203,127,0.82);
      border-color: rgba(93,203,127,0.9);
      color: #fff;
      opacity: 1;
    }
    #roam-btn.roam-on:hover {
      background: rgba(93,203,127,1);
    }
  </style>
</head>
<body>
  <canvas id="companion-canvas"></canvas>
  <!-- role=button + title give keyboard/screen-reader users a hint -->
  <div id="hit-zone" role="button" tabindex="-1" aria-label="Companion — drag to move, click to interact" title="Drag to move · Click to greet · Double-click for surprise!"></div>
  <!-- Free Roam toggle: 🌐 = off (bottom-walk), 🗺 = on (roam anywhere) -->
  <button id="roam-btn" aria-label="Toggle Free Roam mode" title="Toggle Free Roam — companion walks anywhere on screen">🌐</button>
  <script type="module" src="./companion-overlay.js"></script>
</body>
</html>
