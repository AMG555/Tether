<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: no-drag;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
    }
    /* Invisible hit zone — follows the character position, captures mouse events */
    #hit-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 220px;
      pointer-events: auto;
      cursor: grab;
      background: transparent;
      z-index: 10;
      touch-action: none;
    }
    #hit-zone.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="companion-canvas"></canvas>
  <div id="hit-zone"></div>
  <script type="module" src="./companion-overlay.js"></script>
</body>
</html>
